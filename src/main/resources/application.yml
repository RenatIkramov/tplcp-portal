spring:
  application:
    name: tplcp-portal

  datasource:
    # Подключаемся РОЛЬЮ ПРИЛОЖЕНИЯ portal_app, а не владельцем схемы.
    # Владелец обходит политики RLS — изоляция поклажедателей не сработает.
    url: jdbc:postgresql://localhost:5432/tplcp?currentSchema=dbo
    username: portal_app
    password: portal_app_dev
    hikari:
      maximum-pool-size: 10

  servlet:
    multipart:
      # Загрузка номенклатуры из Excel. По умолчанию Spring Boot принимает
      # не больше 1 МБ, и файл на 2 МБ отлетал бы ещё до нашего кода —
      # с невнятной ошибкой вместо объяснения. Держим чуть выше нашего
      # предела (2 МБ в SkuImportService), чтобы отказ выдавали мы сами
      # и понятным текстом.
      max-file-size: 3MB
      max-request-size: 4MB

  flyway:
    # Миграции применяет сам портал при старте: так база не может отстать
    # от кода. Если миграция падает, приложение не стартует — это нарочно,
    # лучше явная остановка, чем работа на половине схемы.
    enabled: true
    schemas: dbo
    default-schema: dbo

    # ВАЖНО: миграции идут НЕ ролью приложения. У portal_app намеренно нет
    # прав создавать таблицы и функции — иначе смысл RLS теряется. Поэтому
    # Flyway подключается владельцем схемы.
    # Пароль здесь только для разработки; в эксплуатации задаётся
    # переменной окружения FLYWAY_DB_PASSWORD.
    url: jdbc:postgresql://localhost:5432/tplcp
    user: postgres
    password: ${FLYWAY_DB_PASSWORD:123}

    # Схема до V20 накатана вручную. baseline говорит Flyway: «всё до
    # двадцатой версии уже есть», он заводит историю и начинает с V21.
    # Выполнять заново V1..V20 он не будет.
    baseline-on-migrate: true
    baseline-version: 20
    baseline-description: Схема накатана вручную до перехода на Flyway

server:
  port: 8080
  servlet:
    session:
      timeout: 2h
      cookie:
        http-only: true          # cookie сессии недоступен скриптам на странице
        same-site: strict        # браузер не отправит его по запросу с чужого сайта
        secure: false            # ВКЛЮЧИТЬ в продакшне: cookie только по HTTPS

logging:
  level:
    # Каждый SQL-запрос в консоль — удобно при разборе, но заметно замедляет
    # работу, когда консоль открыта. Включайте на время: смените на DEBUG.
    org.springframework.jdbc.core: INFO
